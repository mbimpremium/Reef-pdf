name: Desktop app (Windows)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', '.github/workflows/desktop.yml']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Write the Tauri project
        shell: bash
        run: |
          mkdir -p desktop/dist desktop/src-tauri/src desktop/src-tauri/capabilities
          cp index.html manifest.webmanifest desktop/dist/
          cp icon-*.png ocr-* *.txt desktop/dist/ 2>/dev/null || true
          cat > desktop/src-tauri/Cargo.toml <<'EOF'
          [package]
          name = "reef-pdf"
          version = "1.0.0"
          edition = "2021"

          [build-dependencies]
          tauri-build = { version = "2", features = [] }

          [dependencies]
          tauri = { version = "2", features = [] }
          tauri-plugin-single-instance = "2"
          serde_json = "1"
          EOF
          cat > desktop/src-tauri/build.rs <<'EOF'
          fn main() { tauri_build::build() }
          EOF
          cat > desktop/src-tauri/capabilities/default.json <<'EOF'
          { "identifier": "default", "windows": ["main"], "permissions": ["core:default"] }
          EOF
          cat > desktop/src-tauri/tauri.conf.json <<'EOF'
          {
            "productName": "Reef PDF",
            "version": "1.0.0",
            "identifier": "io.github.mbimpremium.reefpdf",
            "build": { "frontendDist": "../dist" },
            "app": { "withGlobalTauri": true, "windows": [], "security": { "csp": null } },
            "bundle": {
              "active": true,
              "targets": ["nsis"],
              "icon": ["icons/32x32.png", "icons/128x128.png", "icons/icon.ico"],
              "publisher": "Hasbi Robbani",
              "copyright": "(c) 2026 Hasbi Robbani",
              "fileAssociations": [{ "ext": ["pdf"], "name": "PDF document", "description": "PDF document", "role": "Editor", "mimeType": "application/pdf" }],
              "windows": { "nsis": { "installMode": "currentUser" }, "webviewInstallMode": { "type": "skip" } }
            }
          }
          EOF
          cat > desktop/src-tauri/src/main.rs <<'EOF'
          #![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]
          use tauri::{Emitter, Manager};

          // Files are read by the app itself, so any folder works (AppData, Temp, Outlook attachments, 7-Zip).
          #[tauri::command]
          fn read_file(path: String) -> Result<tauri::ipc::Response, String> {
              std::fs::read(&path).map(tauri::ipc::Response::new).map_err(|e| e.to_string())
          }
          fn file_args(args: Vec<String>) -> Vec<String> {
              args.into_iter().skip(1).filter(|a| !a.starts_with('-') && std::path::Path::new(a).is_file()).collect()
          }
          #[tauri::command]
          fn launch_files() -> Vec<String> { file_args(std::env::args().collect()) }

          const INIT: &str = r#"
          (function () {
            if (window.top !== window) return;
            var T = function () { return window.__TAURI__; };
            var ready = function () { return new Promise(function (res) { var t = setInterval(function () { var b = document.querySelector('#busy'); if (window.__reef && b && b.hidden && T()) { clearInterval(t); res(); } }, 150); }); };
            async function open(paths) {
              if (!paths || !paths.length) return;
              await ready();
              var files = [];
              for (var p of paths) {
                try { var buf = await T().core.invoke('read_file', { path: p }); var name = p.split(/[\\/]/).pop(); files.push(new File([buf], name, { type: /\.pdf$/i.test(name) ? 'application/pdf' : '' })); }
                catch (e) { console.error('Reef PDF: could not read', p, e); }
              }
              if (files.length) window.__reef.openFiles(files, 'replace');
            }
            window.addEventListener('DOMContentLoaded', async function () {
              await ready();
              T().event.listen('open-files', function (e) { open(e.payload); });
              open(await T().core.invoke('launch_files'));
            });
          })();
          "#;

          fn main() {
              tauri::Builder::default()
                  .plugin(tauri_plugin_single_instance::init(|app, args, _cwd| {
                      if let Some(w) = app.get_webview_window("main") { let _ = w.unminimize(); let _ = w.set_focus(); }
                      let _ = app.emit("open-files", file_args(args));
                  }))
                  .invoke_handler(tauri::generate_handler![read_file, launch_files])
                  .setup(|app| {
                      tauri::WebviewWindowBuilder::new(app, "main", tauri::WebviewUrl::App("index.html".into()))
                          .title("Reef PDF")
                          .inner_size(1360.0, 860.0)
                          .min_inner_size(420.0, 500.0)
                          .initialization_script(INIT)
                          .build()?;
                      Ok(())
                  })
                  .run(tauri::generate_context!())
                  .expect("error while running Reef PDF");
          }
          EOF
      - name: Build the installer
        shell: bash
        working-directory: desktop
        run: |
          npm install -g @tauri-apps/cli@2
          tauri icon ../icon-512.png
          tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Reef-PDF-Setup
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
